<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learning Dashboard</title>
<style>
:root {
  color-scheme: light;
  --bg: #f6f5f2; --surface: #fcfcfb; --border: #e4e2dc;
  --text: #0b0b0b; --text-2: #52514e; --text-3: #7a7973;
  --grid: #ecebe7; --accent: #2a78d6;
  --s-new: #86b6ef; --s-learning: #3987e5; --s-familiar: #1c5cab; --s-known: #0d366b;
  --good: #0ca30c; --warn: #fab219; --crit: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --border: #2e2e2c;
    --text: #ffffff; --text-2: #c3c2b7; --text-3: #8e8d85;
    --grid: #2a2a28; --accent: #3987e5;
    --s-new: #256abf; --s-learning: #3987e5; --s-familiar: #6da7ec; --s-known: #9ec5f4;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --border: #2e2e2c;
  --text: #ffffff; --text-2: #c3c2b7; --text-3: #8e8d85;
  --grid: #2a2a28; --accent: #3987e5;
  --s-new: #256abf; --s-learning: #3987e5; --s-familiar: #6da7ec; --s-known: #9ec5f4;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans", sans-serif; }
main { max-width: 1040px; margin: 0 auto; padding: 28px 16px 48px; }
header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; margin-bottom: 20px; }
h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.01em; }
h2 { font-size: 15px; margin: 0 0 12px; font-weight: 600; }
.sub { color: var(--text-2); font-size: 14px; }
.levels { display: flex; gap: 8px; flex-wrap: wrap; }
.level { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 6px 12px; text-align: center; }
.level b { display: block; font-size: 20px; }
.level.prov { border-style: dashed; }
.level.prov b { color: var(--text-2); }
.level span { font-size: 12px; color: var(--text-2); }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(12, 1fr); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; min-width: 0; }
.span-3 { grid-column: span 3; } .span-4 { grid-column: span 4; } .span-6 { grid-column: span 6; }
.span-8 { grid-column: span 8; } .span-12 { grid-column: span 12; }
@media (max-width: 820px) { .span-3 { grid-column: span 6; } .span-4, .span-6, .span-8 { grid-column: span 12; } }
.stat .n { font-size: 32px; font-weight: 650; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat .l { color: var(--text-2); font-size: 13px; }
.stack { display: flex; height: 22px; gap: 2px; border-radius: 6px; overflow: hidden; margin: 6px 0 12px; }
.stack div { min-width: 3px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--text-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend b { color: var(--text); font-variant-numeric: tabular-nums; }
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { fill: var(--text-3); font-size: 11px; }
.bar { fill: var(--accent); }
.bar-hit { fill: transparent; cursor: default; }
.bar-hit:hover + .bar, .bar.active { opacity: .75; }
#tip { position: fixed; pointer-events: none; background: var(--text); color: var(--surface); font-size: 12px;
  padding: 5px 8px; border-radius: 6px; opacity: 0; transition: opacity .1s; z-index: 10; white-space: nowrap; }
.word { padding: 10px 0; border-top: 1px solid var(--border); }
.word:first-of-type { border-top: 0; padding-top: 0; }
.word .w { font-weight: 600; }
.word .m { color: var(--text-2); font-size: 13px; }
.word .s { font-size: 14px; margin-top: 2px; }
.word .src { color: var(--text-3); font-size: 12px; }
.pill { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--border); color: var(--text-2); margin-left: 6px; vertical-align: 1px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; color: var(--text-2); font-weight: 500; padding: 4px 8px 6px 0; border-bottom: 1px solid var(--border); }
td { padding: 7px 8px 7px 0; border-bottom: 1px solid var(--border); vertical-align: top; }
td.num { font-variant-numeric: tabular-nums; text-align: right; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--border); border-radius: 99px; padding: 3px 10px 3px 8px; font-size: 13px; }
.chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.chip .st { color: var(--text-3); margin-left: 4px; }
ol, ul { margin: 0; padding-left: 20px; } li { margin: 4px 0; }
.empty { color: var(--text-3); font-size: 14px; }
details { margin-top: 10px; font-size: 13px; color: var(--text-2); }
summary { cursor: pointer; }
.story-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 24px; }
.kicker { font-size: 12px; color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; }
.story-title { font-size: 20px; margin: 2px 0 2px; }
.story-stats { display: flex; gap: 24px; }
.story-stats div { text-align: center; }
.story-stats b { display: block; font-size: 26px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.story-stats span { font-size: 12px; color: var(--text-2); }
.latest { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 14px; }
footer { margin-top: 24px; color: var(--text-3); font-size: 12px; text-align: center; }
</style>
</head>
<body>
<main id="app"></main>
<div id="tip" role="tooltip"></div>
<script>
const D = /*__DATA__*/null;
const $ = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstChild; };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDay = (iso, opts) => new Date(iso + 'T00:00:00').toLocaleDateString(undefined, opts);
const STR = [['new','New'],['learning','Learning'],['familiar','Familiar'],['known','Known']];
const about = D.about || {};
const level = (about['level'] || '').split('(')[0].trim();
const detail = ((about['level'] || '').match(/\((.*)\)/) || [])[1] || '';
const provisional = /provisional/i.test(about['level'] || '') || /in progress/i.test(about['last placement test'] || '');
const skillLevels = detail.split(',').map(s => s.split(':').map(x => x.trim())).filter(p => p.length === 2 && p[1]);

function barChart(rows, labelFn, tipFn, height = 150) {
  const W = 480, H = height, pad = { l: 26, r: 4, t: 8, b: 22 };
  const max = Math.max(1, ...rows.map(r => r.count));
  const step = Math.max(1, Math.ceil(max / 4));
  const top = step * Math.ceil(max / step);
  const bw = (W - pad.l - pad.r) / rows.length;
  const y = v => pad.t + (H - pad.t - pad.b) * (1 - v / top);
  let g = '';
  for (let v = 0; v <= top; v += step)
    g += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/>` +
         `<text x="${pad.l - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  rows.forEach((r, i) => {
    const x = pad.l + i * bw + 1, w = Math.max(2, bw - 2), h = y(0) - y(r.count);
    g += `<rect class="bar-hit" x="${x - 1}" y="${pad.t}" width="${bw}" height="${H - pad.t - pad.b}" data-tip="${esc(tipFn(r))}"/>`;
    if (r.count > 0) {
      const rr = Math.min(4, w / 2, h);
      g += `<path class="bar" d="M${x},${y(0)} V${y(r.count) + rr} Q${x},${y(r.count)} ${x + rr},${y(r.count)} H${x + w - rr} Q${x + w},${y(r.count)} ${x + w},${y(r.count) + rr} V${y(0)} Z"/>`;
    }
    const lab = labelFn(r, i);
    if (lab) g += `<text x="${x + w / 2}" y="${H - 6}" text-anchor="middle">${esc(lab)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}

function render() {
  const lang = about['target language'] || D.title.replace(/learning profile/i, '').trim();
  const pct = s => D.total ? (D.counts[s] / D.total * 100) : 0;
  const tbl = (rows, cols) => `<table><thead><tr>${cols.map(c => `<th>${c[0]}</th>`).join('')}</tr></thead><tbody>${
    rows.map(r => `<tr>${cols.map(c => `<td${c[2] ? ' class="num"' : ''}>${esc(c[1](r))}</td>`).join('')}</tr>`).join('')}</tbody></table>`;

  const html = `
  <header>
    <div>
      <h1>${esc(lang)} progress</h1>
      <div class="sub">${esc(about['native / explanation language'] ? 'Explained in ' + about['native / explanation language'] + ' · ' : '')}Updated ${fmtDay(D.today, { month: 'long', day: 'numeric', year: 'numeric' })}${about['last placement test'] ? (/in progress/i.test(about['last placement test']) ? ' · Placement test ' : ' · Last placement test ') + esc(about['last placement test']) : ''}</div>
    </div>
    <div class="levels">
      ${level ? `<div class="level${provisional ? ' prov' : ''}" ${provisional ? 'data-tip="Placement test not finished yet"' : ''}><b>${esc(level)}</b><span>${provisional ? 'Provisional' : 'Overall'}</span></div>` : ''}
      ${skillLevels.map(([k, v]) => `<div class="level"><b>${esc(v)}</b><span>${esc(k)}</span></div>`).join('')}
    </div>
  </header>

  <section class="grid">
    <div class="card stat span-3"><div class="n">${D.total}</div><div class="l">Words &amp; phrases saved</div></div>
    <div class="card stat span-3"><div class="n">${D.dueToday}</div><div class="l">Due for review today</div></div>
    <div class="card stat span-3"><div class="n">${D.streak}</div><div class="l">Day streak</div></div>
    <div class="card stat span-3"><div class="n">${D.sessionsThisMonth}</div><div class="l">Sessions this month</div></div>

    ${D.story ? `<div class="card span-12 story">
      <div class="story-head">
        <div><div class="kicker">Your story${D.story.genre ? ' · ' + esc(D.story.genre) : ''}${D.story.setting ? ' · ' + esc(D.story.setting) : ''}</div>
        <h2 class="story-title" dir="auto">${esc(D.story.title)}</h2>
        ${D.story.question ? `<div class="sub">Season ${esc(D.story.season)}: ${esc(D.story.question)}</div>` : ''}</div>
        <div class="story-stats"><div><b>${esc(D.story.episodes)}</b><span>episodes</span></div><div><b>${D.story.clues}</b><span>clues found</span></div></div>
      </div>
      ${D.story.latest ? `<div class="latest"><span class="kicker">Latest episode</span><div dir="auto">${esc(D.story.latest)}</div></div>` : ''}
    </div>` : ''}

    <div class="card span-12">
      <h2>Vocabulary by strength</h2>
      ${D.total ? `<div class="stack" role="img" aria-label="Vocabulary by strength">${STR.filter(([k]) => D.counts[k]).map(([k, l]) =>
          `<div style="flex:${D.counts[k]};background:var(--s-${k})" data-tip="${l}: ${D.counts[k]} (${Math.round(pct(k))}%)"></div>`).join('')}</div>
        <div class="legend">${STR.map(([k, l]) => `<span><i style="background:var(--s-${k})"></i>${l} <b>${D.counts[k]}</b></span>`).join('')}</div>`
        : '<p class="empty">No words saved yet — learn a few in context and they will show up here.</p>'}
    </div>

    <div class="card span-6">
      <h2>Words added per week</h2>
      ${barChart(D.addedByWeek, (r, i) => i % 2 === 1 ? fmtDay(r.week, { month: 'short', day: 'numeric' }) : '',
        r => `Week of ${fmtDay(r.week, { month: 'short', day: 'numeric' })}: ${r.count} added`)}
      <details><summary>Show as table</summary>${tbl(D.addedByWeek, [['Week of', r => r.week], ['Added', r => r.count, 1]])}</details>
    </div>
    <div class="card span-6">
      <h2>Reviews coming up</h2>
      ${barChart(D.dueNext7, (r, i) => i === 0 ? 'Today' : fmtDay(r.date, { weekday: 'short' }),
        r => `${fmtDay(r.date, { weekday: 'long', month: 'short', day: 'numeric' })}: ${r.count} due`)}
      <details><summary>Show as table</summary>${tbl(D.dueNext7, [['Day', r => r.date], ['Due', r => r.count, 1]])}</details>
    </div>

    <div class="card span-8">
      <h2>Recently learned — in context</h2>
      ${D.recentWords.length ? D.recentWords.map(w => `
        <div class="word">
          <div><span class="w" dir="auto">${esc(w.word)}</span><span class="pill">${esc(w.strength)}</span> <span class="m">${esc(w.meaning)}</span></div>
          <div class="s" dir="auto">${esc(w.sentence)}</div>
          ${w.source ? `<div class="src">${esc(w.source)}</div>` : ''}
        </div>`).join('') : '<p class="empty">Nothing yet.</p>'}
    </div>
    <div class="card span-4">
      <h2>Suggested next steps</h2>
      ${D.nextSteps.length ? `<ol>${D.nextSteps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>` : '<p class="empty">Ask your coach for suggestions.</p>'}
      <h2 style="margin-top:20px">Recent sessions</h2>
      ${D.recentSessions.length ? `<ul>${D.recentSessions.map(s => `<li><b>${fmtDay(s.date, { month: 'short', day: 'numeric' })}</b> <span class="sub">${esc(s.text)}</span></li>`).join('')}</ul>` : '<p class="empty">No sessions logged yet.</p>'}
    </div>

    <div class="card span-6">
      <h2>Recurring mistakes</h2>
      ${D.mistakes.length ? tbl(D.mistakes, [['Pattern', r => r.pattern], ['Example', r => r.example], ['Seen', r => r.times, 1]])
        : '<p class="empty">No recurring mistakes logged. Nice.</p>'}
    </div>
    <div class="card span-6">
      <h2>Grammar covered</h2>
      ${D.grammar.length ? `<div class="chips">${D.grammar.map(g => {
          const c = g.status.startsWith('comfort') ? 'var(--good)' : g.status.startsWith('shaky') ? 'var(--warn)' : 'var(--text-3)';
          return `<span class="chip"><span class="dot" style="background:${c}"></span>${esc(g.topic)}<span class="st">${esc(g.status || '')}</span></span>`;
        }).join('')}</div>` : '<p class="empty">No grammar topics logged yet.</p>'}
    </div>
  </section>
  <footer>Generated from your learning profile · speaker-skill</footer>`;
  document.getElementById('app').innerHTML = html;
}
render();

const tip = document.getElementById('tip');
document.addEventListener('mousemove', e => {
  const t = e.target.closest('[data-tip]');
  if (!t) { tip.style.opacity = 0; return; }
  tip.textContent = t.dataset.tip;
  const x = Math.min(e.clientX + 12, window.innerWidth - tip.offsetWidth - 8);
  tip.style.left = x + 'px'; tip.style.top = (e.clientY - 34) + 'px'; tip.style.opacity = 1;
});
</script>
</body>
</html>
